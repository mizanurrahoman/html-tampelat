<!--<!doctype html><html lang="en"><head><meta charset="=UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="description" content="This is a codeng"><meta name="viewport" content="width=device-width, initial-scale=1.0">--><!--<link rel="stylesheet" href="style.css">--><!--<style></style><title>Code Editor - Programming Ocean Academ</title></head><body><header><div class="container row"><div class="brand"><div class="logo"></div><div class="title">Code Editor - Live in the borowser</div></div><div class="row"><button class="btn secondary" id="saveBtn" title="Save wrk locally"><span>Save</span></button><button class="btn secondary" id="loadBtn" title="load work file"><span>Load</span></button><input id="openFile" type="file" accept="application/json" hidden></div></div></header></body></html>--><!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="description" content="This is a feedback UI"><meta name="viewport" content="width=device-width, initial-scale=1.0"><!--<link rel="stylesheet" href="style.css">--><style>body{margin: 0; background-color: lightcyan; color: darkgreen; display: flex; min-height: 100vh; justify-content: center; font-family: monospace;}.rating img{width: 40px;}.container{background: rgba(255,255,255,.3); box-shadow: 0 5px 10px rgba(0,0,0,.3); border-radius: 10px; padding: 20px; width: 85%; max-width: 400px; text-align: center; font-size: 20px;}.ratings_container{display: flex; padding: 20px 0;}.heading{margin: 5px; font-size: 30px;}.rating{cursor: pointer; padding: 10px; margin: 10px 5px;}.rating:hover{background: darkseagreen; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.3); color: aliceblue; transition: all 300ms ease;}.btn{background-color: darkcyan; color: aliceblue; border: 0; margin: 10px; border-radius: 4px; padding: 12px 30px; cursor: pointer;}.btn:hover{box-shadow: 0 5px 10px rgba(0,0,0,0.3); transition: all 300ms ease;  }.btn:active{transform: scale(0.96)}</style><title>Feedback UI</title></head><body><div class="container" id="container"><h1 class="heading">Feedback UI</h1><div class="ratings_container" id="ratings_contaner"><div class="rating">active<img src="😑" alt=""><small>Unhappy</small></div><div class="rating">active<img src="😐" alt=""><small>Neutral</small></div><div class="rating">active<img src="😊" alt=""><small>Satisfied</small></div></div><button class="btn" id="btn">Send Review</button></div><!--<script src="index.js"></script>--><script>/*alert("Script");*/SelectedRating = cvent.target. btnEl.addEventListener("click",()=>{if(selectedRating!= ="abc");{ containerEl.innerHTML = ("<strong>Thank you</strong>"<br> <br> <strong>Feedback:${selectedRating}</strong>} const ratingEls = document.querySelectorAll(".rating"); const btnEl = document.getElementById("btn") let selectedRating = ""; ratingEls.forEach((ratingEl) =>{ratingEl.addEventListener("click",(event)=>{console.log(event.target.innerText || event.target.parentNode.innerText); removeActive(); event.target.classList. add ("active") event.target.parentNode.classList.add ("active"); function removeActive(){ratingEls.forEach((ratingEl)=>{ratingEl.classList.remove("active");})}})})};</script></body></html>
